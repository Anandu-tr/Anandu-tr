<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Expertise grid">
  <rect width="760" height="250" rx="12" fill="#0e0c0a"/>
  <g font-family="-apple-system,'Segoe UI',sans-serif">
    <!-- row 1 -->
    <rect x="36" y="34" width="26" height="4" rx="2" fill="#eda35c"/>
    <text x="36" y="60" font-size="15" font-weight="600" fill="#f2f0ec">End-to-end product delivery</text>
    <text x="36" y="80" font-size="12" fill="#9d958a">App, API, and infrastructure —</text>
    <text x="36" y="96" font-size="12" fill="#9d958a">sketch to production, one pair of hands.</text>
    <rect x="286" y="34" width="26" height="4" rx="2" fill="#eda35c"/>
    <text x="286" y="60" font-size="15" font-weight="600" fill="#f2f0ec">Resilient mobile systems</text>
    <text x="286" y="80" font-size="12" fill="#9d958a">Background execution past OS kills,</text>
    <text x="286" y="96" font-size="12" fill="#9d958a">offline-first flows, tamper detection.</text>
    <rect x="536" y="34" width="26" height="4" rx="2" fill="#eda35c"/>
    <text x="536" y="60" font-size="15" font-weight="600" fill="#f2f0ec">Applied AI agents</text>
    <text x="536" y="80" font-size="12" fill="#9d958a">Tool-use pipelines embedded in ERPs</text>
    <text x="536" y="96" font-size="12" fill="#9d958a">and daily business operations.</text>
    <!-- row 2 -->
    <rect x="36" y="144" width="26" height="4" rx="2" fill="#eda35c"/>
    <text x="36" y="170" font-size="15" font-weight="600" fill="#f2f0ec">Real-time media</text>
    <text x="36" y="190" font-size="12" fill="#9d958a">LiveKit/WebRTC avatar calling</text>
    <text x="36" y="206" font-size="12" fill="#9d958a">at production reliability.</text>
    <rect x="286" y="144" width="26" height="4" rx="2" fill="#eda35c"/>
    <text x="286" y="170" font-size="15" font-weight="600" fill="#f2f0ec">Multi-tenant architecture</text>
    <text x="286" y="190" font-size="12" fill="#9d958a">Postgres RLS isolation with</text>
    <text x="286" y="206" font-size="12" fill="#9d958a">provable tenant boundaries.</text>
    <rect x="536" y="144" width="26" height="4" rx="2" fill="#eda35c"/>
    <text x="536" y="170" font-size="15" font-weight="600" fill="#f2f0ec">Cost-lean cloud</text>
    <text x="536" y="190" font-size="12" fill="#9d958a">Serverless designs tuned for</text>
    <text x="536" y="206" font-size="12" fill="#9d958a">small, predictable bills.</text>
  </g>
</svg>