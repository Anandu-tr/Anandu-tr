<svg viewBox="0 0 430 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Field-ops location platform">
  <rect x="1" y="1" width="428" height="198" rx="8" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="18" y="34" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#4493f8">📍 Field-ops location platform</text>
  <text x="18" y="62" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#9ba3ad"><tspan font-weight="700" fill="#e6edf3">Problem:</tspan> field-staff GPS reporting where every dropped</text>
  <text x="18" y="82" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#9ba3ad">point is a dispute.</text>
  <text x="18" y="108" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#9ba3ad"><tspan font-weight="700" fill="#e6edf3">Built:</tspan> tamper-evident capture → buffered batch pipeline</text>
  <text x="18" y="128" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#9ba3ad">→ route &amp; distance reporting. The public</text>
  <text x="18" y="148" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#4493f8">expo-livetrack module grew out of this.</text>
  <circle cx="24" cy="173" r="4.5" fill="#3fb950"/>
  <text x="36" y="178" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#3fb950">In production</text>
</svg>
