  <g fill="#eda35c">
    <circle cx="70" cy="50" r="7"/>
    <circle cx="62" cy="92" r="7"/>
    <circle cx="70" cy="134" r="7"/>
  </g>
  <text x="66" y="163" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#a89f93">agent swarm</text>
  <circle cx="178" cy="90" r="24" fill="#241809" stroke="#eda35c" stroke-width="2.5"/>
  <circle cx="178" cy="90" r="8" fill="#eda35c"/>
  <text x="178" y="132" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#a89f93">orchestrator · LangGraph / ADK</text>
  <rect x="320" y="34" width="128" height="34" rx="8" fill="#241809" stroke="#8a5a24" stroke-width="1.5"/>
  <text x="384" y="55" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#f0e6d8">MCP · tool-use</text>
  <rect x="320" y="110" width="128" height="34" rx="8" fill="#241809" stroke="#8a5a24" stroke-width="1.5"/>
  <text x="384" y="131" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#f0e6d8">RAG · vector DBs</text>
