    <circle r="3" fill="#2ea043"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite"><mpath href="#pMCP"/></animateMotion></circle>
    <circle r="3" fill="#2ea043"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#pRAG"/></animateMotion></circle>
