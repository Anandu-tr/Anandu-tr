name: Activity Gauge
on:
  schedule:
    - cron: "15 0 * * *"   # daily, 05:45 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gauge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-activity.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet assets/activity.svg; then
            git add assets/activity.svg
            git commit -m "chore: refresh activity gauge"
            git push
          fi
