name: Space Shooter
on:
  schedule:
    - cron: "30 0 * * *"   # daily, 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: czl9707/gh-space-shooter@v2
        with:
          username: Anandu-tr
          output-path: space-shooter.webp
          strategy: random
          github-token: ${{ secrets.GITHUB_TOKEN }}